<!doctype html>
<html lang="zh-CN" data-build="29">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lean Atlas 薄肌图谱</title>
<meta name="description" content="A real-anatomy 3D muscle atlas: turn the body, tap any muscle, watch the lesson. 真实解剖 3D 薄肌训练图谱。">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&display=swap">
<link rel="stylesheet" href="styles.css?v=29">
<script>
/* GitHub Pages lets browsers cache this page for up to 10 minutes. On load, ask the server (bypassing the cache)
   which build is live; if it is newer than the one showing, reload once onto a fresh URL. */
(function () {
  var mine = document.documentElement.getAttribute("data-build");
  if (!window.fetch) return;
  fetch(location.pathname + "?build-check=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (html) {
    var m = /data-build="(\d+)"/.exec(html), live = m && m[1];
    if (!live || live === mine) return;
    var key = "la-reload-" + live;
    try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, "1"); } catch (e) {}
    location.replace(location.pathname + "?v=" + live + location.hash);
  }).catch(function () {});
})();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js"
} }
</script>
</head>
<body>

<header class="top">
  <div class="lang" role="group" aria-label="Language">
    <button type="button" id="lang-zh" data-lang="zh">中文</button>
    <button type="button" id="lang-en" data-lang="en">EN</button>
  </div>
</header>

<main id="top">
  <section class="intro" aria-labelledby="intro-title">
    <h1 id="intro-title"><span data-t="introStart"></span><em data-t="introEnd"></em></h1>
    <p class="intro-lede" data-t="introLede"></p>
    <ul class="intro-stats">
      <li><b id="stat-muscles">23</b><span data-t="stat1"></span></li>
      <li><b id="stat-videos">102</b><span data-t="stat2"></span></li>
      <li><b>360°</b><span data-t="stat3"></span></li>
    </ul>
  </section>
  <section class="stage" id="atlas">
    <div class="gl-wrap" id="stage"><canvas id="gl" aria-label="3D anatomy model"></canvas></div>
    <div class="bars" aria-hidden="true"></div>

    <section class="combos" aria-labelledby="dial-muscles dial-combos">
      <div class="dial-modes" data-active="muscles">
        <span class="dial-modes-knob" aria-hidden="true"></span>
        <button type="button" id="dial-muscles" data-mode="muscles" data-t="muscleGroups" aria-pressed="true"></button>
        <button type="button" id="dial-combos" data-mode="combos" data-t="combos" aria-pressed="false"></button>
      </div>
      <div class="combo-dial" id="combo-dial">
        <div class="dial-scale" aria-hidden="true"></div>
        <div class="dial-bezel" aria-hidden="true"></div>
        <div class="dial-outer" role="group" aria-labelledby="dial-muscles"></div>
        <div class="dial-groove" aria-hidden="true"></div>
        <div class="dial-well" aria-hidden="true"></div>
        <div class="dial-inner" role="group" aria-labelledby="dial-selection"></div>
        <i class="dial-index dial-index-outer" aria-hidden="true"></i>
        <i class="dial-index dial-index-inner" aria-hidden="true"></i>
        <div class="dial-hub">
          <strong id="dial-selection" aria-live="polite"></strong>
          <span class="dial-meta" id="dial-meta"></span>
          <button type="button" class="combo-reset" data-t="wholeBody" hidden></button>
        </div>
      </div>
      <div class="dial-foot">
        <p class="dial-hint"><span class="hint-fine" data-t="dialHint"></span><span class="hint-touch" data-t="dialHintTouch"></span></p>
        <button type="button" class="dial-sound" id="dial-sound" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="spk" d="M2 6h2.5L8 3v10L4.5 10H2z"/><path class="w1" d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/><path class="w2" d="M12.3 3.6a6.2 6.2 0 0 1 0 8.8"/><path class="mute" d="M10.5 6l4 4m0-4l-4 4"/></svg><span></span></button>
      </div>
      <ol class="combo-exercises" id="combo-exercises" aria-live="polite"></ol>
    </section>

    <div class="hud" id="hud">
      <div class="hud-group" role="group" aria-label="View">
        <button type="button" data-face="front" data-t="front"></button>
        <button type="button" data-face="right" data-t="sideR"></button>
        <button type="button" data-face="back" data-t="back"></button>
        <button type="button" data-face="left" data-t="sideL"></button>
      </div>
      <div class="hud-group">
        <button type="button" id="btn-auto" aria-pressed="true" data-t="auto"></button>
        <button type="button" id="btn-out" aria-label="Zoom out">−</button>
        <button type="button" id="btn-in" aria-label="Zoom in">+</button>
      </div>
    </div>

    <div class="loader" id="loader">
      <p data-t="loading"></p>
      <div class="bar"><i id="loader-bar"></i></div>
      <span id="loader-pct">0%</span>
    </div>
  </section>


</main>

<footer class="foot wrap">
  <p data-t="foot1"></p>
  <p data-t="foot3"></p>
  <p data-t="foot2"></p>
  <p class="mono">LEAN ATLAS · 2026</p>
</footer>

<div class="tip" id="tip" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="d-title" hidden>
  <div class="d-in" id="d-in"></div>
</aside>

<script src="js/data.js?v=23"></script>
<script src="js/videos-zh.js?v=14"></script>
<script src="js/names.js?v=14"></script>
<script src="js/app.js?v=24"></script>
<script type="module" src="js/viewer.js?v=28"></script>
</body>
</html>
